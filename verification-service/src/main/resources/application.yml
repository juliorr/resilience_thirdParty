spring:
  application:
    name: verification
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 1000
            read-timeout: 2000

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,dynamoDb
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
    baggage:
      remote-fields:
        - verificationId
      correlation:
        fields:
          - verificationId

resilience4j:
  circuitbreaker:
    instances:
      free:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 60
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
      premium:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 60
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    open-paths:
      - /actuator/health/**
      - /actuator/info
      - /actuator/prometheus
      - /swagger-ui.html
      - /swagger-ui/**
      - /v3/api-docs/**
  third-party:
    base-url: ${APP_THIRD_PARTY_BASE_URL:http://localhost:8081}
  persistence:
    table-name: verification
    create-table-on-startup: true
  dynamodb:
    endpoint: http://localhost:8000
    region: us-east-1
    access-key: local
    secret-key: local
