services:
  app:
    build:
      context: .
      dockerfile: verification-service/Dockerfile
    image: verification-service:latest
    container_name: verification-app
    depends_on:
      - dynamodb
      - third-party
    environment:
      SPRING_PROFILES_ACTIVE: local
      APP_THIRD_PARTY_BASE_URL: http://third-party:8081
      APP_DYNAMODB_ENDPOINT: http://dynamodb:8000
      APP_DYNAMODB_ACCESS_KEY: local
      APP_DYNAMODB_SECRET_KEY: local
    labels:
      logging_app: verification
    ports:
      - "${APP_HOST_PORT:-8080}:8080"

  third-party:
    build:
      context: .
      dockerfile: third-party-service/Dockerfile
    image: third-party-service:latest
    container_name: verification-third-party
    labels:
      logging_app: third-party
    ports:
      - "${THIRD_PARTY_HOST_PORT:-8081}:8081"

  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: verification-dynamodb
    user: root
    command: ["-jar", "DynamoDBLocal.jar", "-dbPath", "/home/dynamodblocal/data", "-sharedDb"]
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    ports:
      - "${DYNAMODB_HOST_PORT:-8000}:8000"

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: verification-dynamodb-admin
    depends_on:
      - dynamodb
    environment:
      DYNAMO_ENDPOINT: http://dynamodb:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    ports:
      - "${DYNAMODB_ADMIN_HOST_PORT:-8002}:8001"

  prometheus:
    image: prom/prometheus:latest
    container_name: verification-prometheus
    depends_on:
      - app
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: verification-grafana
    depends_on:
      - prometheus
      - loki
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"

  loki:
    image: grafana/loki:3.0.0
    container_name: verification-loki
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    expose:
      - "3100"

  promtail:
    image: grafana/promtail:3.0.0
    container_name: verification-promtail
    depends_on:
      - loki
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  dynamodb-data:
