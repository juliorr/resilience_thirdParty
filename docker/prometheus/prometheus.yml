global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: verification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['app:8080']

  - job_name: third-party-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['third-party:8081']
